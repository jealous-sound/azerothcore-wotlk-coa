name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y luajit zip unzip ripgrep
      - name: Validate source, catalog, generator, and addon package
        run: ./tests/test-release.sh

  server-build:
    name: server-build (${{ matrix.stack }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stack: [azerothcore, playerbots]
    steps:
      - uses: actions/checkout@v5
        with:
          path: mod-homebrew-nourishment
      - name: Check out AzerothCore
        if: matrix.stack == 'azerothcore'
        run: git clone --depth 1 https://github.com/azerothcore/azerothcore-wotlk.git azerothcore
      - name: Check out AzerothCore and mod-playerbots
        if: matrix.stack == 'playerbots'
        run: |
          git clone --depth 1 --branch Playerbot https://github.com/mod-playerbots/azerothcore-wotlk.git azerothcore
          git clone --depth 1 --branch master https://github.com/mod-playerbots/mod-playerbots.git azerothcore/modules/mod-playerbots
      - name: Install module
        run: cp -a "$GITHUB_WORKSPACE/mod-homebrew-nourishment" azerothcore/modules/mod-homebrew-nourishment
      - name: Install upstream AzerothCore dependencies
        if: matrix.stack == 'azerothcore'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          sudo apt-get update && sudo apt-get install -y
          cmake make gcc g++ clang default-libmysqlclient-dev
          libssl-dev libbz2-dev libreadline-dev libncurses-dev libboost-all-dev
      - name: Install Playerbot stack dependencies
        if: matrix.stack == 'playerbots'
        working-directory: azerothcore
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo -E ./acore.sh install-deps
      - name: Configure
        run: >-
          cmake -S azerothcore -B azerothcore/build
          -DCMAKE_BUILD_TYPE=Release
          -DTOOLS_BUILD=none
          -DSCRIPTS=static
          -DMODULES=static
      - name: Build worldserver
        run: cmake --build azerothcore/build --target worldserver --parallel 2
